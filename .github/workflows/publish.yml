name: Publish
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "full=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=v${MINOR}" >> "$GITHUB_OUTPUT"
          echo "major=v${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.full }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/update tags and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create exact version tag
          git tag "${{ steps.version.outputs.full }}" "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.full }}"

          # Force-update minor and major floating tags
          git tag -f "${{ steps.version.outputs.minor }}" "${{ github.sha }}"
          git push -f origin "${{ steps.version.outputs.minor }}"
          git tag -f "${{ steps.version.outputs.major }}" "${{ github.sha }}"
          git push -f origin "${{ steps.version.outputs.major }}"

          # Create GitHub release
          gh release create "${{ steps.version.outputs.full }}" \
            --title "${{ steps.version.outputs.full }}" \
            --generate-notes
